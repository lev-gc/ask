[package]
name = "ask"
version = "0.1.0"
edition = "2021"
description = "Fast AI-powered shell command assistant for Linux/macOS"
license = "MIT"

[[bin]]
name = "ask"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-stream = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
crossterm = "0.27"
arboard = { version = "3", default-features = false }
bytes = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
